# Versjoner som brukes i convention pluginene i buildSrc. Dependabot leser ikke versjoner i
# buildSrc/src/main/kotlin, men oppdaterer denne fila.
# Dependabot oppdaterer bare versjoner som minst én oppføring under [libraries] bruker.

[versions]
slf4j = "2.0.20"
logback = "1.6.8"
logstash-logback-encoder = "9.0"
junit-jupiter = "6.1.3"
junit-platform = "6.1.3"
assertj = "3.27.7"
rapids-and-rivers = "2026111908531795074794"

# Sikkerhetsfikser for transitive avhengigheter (logstash-logback-encoder, rapids-and-rivers/kafka-clients og jwks-rsa).
# Fjern når de som drar dem inn bruker rettede versjoner.
jackson3 = "3.2.4"
micrometer = "1.18.0"
lz4-java = "1.14.1"
snappy-java = "1.1.10.9"
guava = "33.8.0-jre"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
rapids-and-rivers = { module = "com.github.navikt:rapids-and-rivers", version.ref = "rapids-and-rivers" }
# Rapids and rivers uten Ktor. Aliasene starter ikke med rapids-and-rivers, for da blir libs.rapids.and.rivers en gruppe.
tbd-rapids-and-rivers-impl = { module = "com.github.navikt.rapids-and-rivers:rapids-and-rivers-impl", version.ref = "rapids-and-rivers" }
tbd-rapids-and-rivers-api = { module = "com.github.navikt.rapids-and-rivers:rapids-and-rivers-api", version.ref = "rapids-and-rivers" }
tbd-kafka = { module = "com.github.navikt.rapids-and-rivers:kafka", version.ref = "rapids-and-rivers" }
jackson3-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson3" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
jackson3-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson3" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4-java" }
snappy-java = { module = "org.xerial.snappy:snappy-java", version.ref = "snappy-java" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
