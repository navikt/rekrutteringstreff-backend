name: rekrutteringstreff-api
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - apps/rekrutteringstreff-api/**
      - .github/workflows/deploy-rekrutteringstreff-api.yaml
      - .github/workflows/deploy-template.yaml
      - buildSrc/**
      - gradle/wrapper/gradle-wrapper.properties
      - technical-libs/logging/**
      - technical-libs/testrapid/**
  workflow_dispatch:

jobs:
  build-deploy:
    uses: ./.github/workflows/deploy-template.yaml
    with:
      app_name: ${{ github.workflow }}
      deploy_dev_branch: refs/heads/formidlinger-mer-tilgang
    permissions:
      contents: read
      id-token: write
      security-events: write
